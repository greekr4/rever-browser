appId: io.greekr4.reverbrowser
productName: Rever Browser
directories:
  output: release
  buildResources: build
asar: true
files:
  - out/**
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/.bin'
extraMetadata:
  main: out/main/index.js
# electron-updater reads the generated latest-mac.yml / latest.yml from
# these GitHub release assets. Auto-update on macOS requires the app to be
# signed (Squirrel verifies the update's code signature).
publish:
  provider: github
  owner: greekr4
  repo: rever-browser
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: Rever-Browser-${version}-${arch}.${ext}
  # identity left unset: electron-builder auto-picks "Developer ID Application"
  # from the keychain (Squirrel needs it for auto-update).
  darkModeSupport: true
  # http/https + HTML claims make macOS list Rever under
  # System Settings → Desktop & Dock → Default web browser.
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: Web site URL
        CFBundleURLSchemes:
          - http
          - https
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.html
          - public.xhtml
dmg:
  title: ${productName}
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Rever-Browser-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
