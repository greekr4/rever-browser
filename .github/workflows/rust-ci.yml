name: Rust CI

# Tests on pushes to main and on PRs. A branch push without a PR runs nothing,
# so one PR is one cold Servo build, not two. Release packaging is not set up yet.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new commit on the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Servo's dav1d-sys links the system library through pkg-config.
      - name: Install system libraries
        id: libs
        run: |
          brew install dav1d pkgconf
          echo "dav1d=$(pkg-config --modversion dav1d)" >> "$GITHUB_OUTPUT"
      - name: Apply crate patches
        run: ./scripts/apply-rust-patches.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Caches are about 2GB against a 10GB repo limit. Only main saves, so branch
      # caches never evict the one every PR restores from.
      - uses: Swatinem/rust-cache@v2
        with:
          # dav1d-sys keeps the versioned Homebrew path it was built against, so a
          # cache from another dav1d version fails at link time.
          key: dav1d-${{ steps.libs.outputs.dav1d }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every target, the app's binary included: it type-checks what the tests do not build.
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
