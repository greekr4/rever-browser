[package]
name = "rever-ui-traffic"
version = "0.0.0"
edition = "2024"
publish = false
description = "The traffic panel: request list, filters and the detail drawer"

[dependencies]
gpui = { workspace = true }
rever-ui-kit = { path = "../rever-ui-kit" }
rever-core = { path = "../rever-core" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: numbers must parse to the same double JSON.parse gives.
serde_json = { version = "1", features = ["float_roundtrip"] }
url = "2"

[dev-dependencies]
# TestAppContext: clicks, keys and drags are tested against a real window tree.
gpui = { workspace = true, features = ["test-support"] }

[[example]]
name = "preview_traffic"
path = "examples/preview.rs"
