[package]
name = "rever-tools-scripts"
version = "0.0.0"
edition = "2024"
publish = false
description = "MCP tools for script and WASM analysis, execution traces, listeners and crypto tracing"

[dependencies]
rever-tools-api = { path = "../rever-tools-api" }
rever-core = { path = "../rever-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
