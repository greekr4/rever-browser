[package]
name = "rever-analysis"
version = "0.0.0"
edition = "2024"
publish = false
description = "Script, endpoint and request analysis over captured traffic, ported from src/main/mcp"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON.parse keeps key order, and both the masked-body
# re-serialization and the request diff depend on it.
# float_roundtrip: JSON.parse rounds a decimal to the nearest double; without
# this serde_json can be one unit off on 17-digit numbers, and a re-serialized
# body would print other digits than JavaScript does.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Insertion-ordered records (headers, cookies), like the JS objects they replace.
indexmap = { version = "2", features = ["serde"] }
# Linear-time matching for agent-supplied grep patterns.
regex = "1"
# WHATWG URL parsing, standing in for JavaScript's `new URL()`.
url = "2"
# encodeURIComponent / decodeURIComponent.
percent-encoding = "2"
rever-core = { path = "../rever-core" }
rever-scope = { path = "../rever-scope" }
