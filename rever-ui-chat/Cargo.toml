[package]
name = "rever-ui-chat"
version = "0.0.0"
edition = "2024"
publish = false
description = "Chat panel parts: tabs, history menu, model picker, provider icons, permission prompt"

[dependencies]
gpui = { workspace = true }
rever-ui-kit = { path = "../rever-ui-kit" }
rever-core = { path = "../rever-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[example]]
name = "preview_chat"
path = "examples/preview.rs"
