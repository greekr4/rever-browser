[package]
name = "rever-ui-menus"
version = "0.0.0"
edition = "2024"
publish = false
description = "Popup menus, chip selects, toasts and small toolbar widgets"

[dependencies]
gpui = { workspace = true }
rever-ui-kit = { path = "../rever-ui-kit" }
rever-core = { path = "../rever-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# TestAppContext: clicks, Esc, outside presses and the dismiss timers are tested against a real window tree.
gpui = { workspace = true, features = ["test-support"] }

[[example]]
name = "preview_menus"
path = "examples/preview.rs"
