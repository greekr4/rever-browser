[package]
name = "rever-tools-browser"
version = "0.0.0"
edition = "2024"
publish = false
description = "MCP tools driving the tab: navigate, snapshot, click, type, scroll, screenshot, waits, UI crawl"

[dependencies]
rever-tools-api = { path = "../rever-tools-api" }
rever-core = { path = "../rever-core" }
rever-snapshot = { path = "../rever-snapshot" }
# Scope check of navigate, and the fence the crawl reports against.
rever-scope = { path = "../rever-scope" }
# The requests an action set off (triggered-requests.ts is ported there).
rever-analysis = { path = "../rever-analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# time: the pauses of human-shaped input and the polling waits.
# rt: overlay calls are spawned so they never hold up an input event.
tokio = { version = "1", features = ["rt", "time"] }
# WHATWG URL parsing, standing in for JavaScript's `new URL()`.
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util", "sync"] }
