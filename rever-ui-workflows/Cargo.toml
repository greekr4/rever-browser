[package]
name = "rever-ui-workflows"
version = "0.0.0"
edition = "2024"
publish = false
description = "The workflows panel and its macro, pipeline, CLI and template editors"

[dependencies]
gpui = { workspace = true }
rever-ui-kit = { path = "../rever-ui-kit" }
rever-core = { path = "../rever-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[example]]
name = "preview_workflows"
path = "examples/preview.rs"
