<!doctype html>
<meta charset="utf-8">
<title>a dashed border drawn by an SVG background sized in percent</title>
<style>
  div { width: 350px; height: 64px; margin: 20px; border-radius: 12px;
        background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='12' ry='12' stroke='%236633cc' stroke-width='2' stroke-dasharray='6%2c 6' stroke-linecap='square'/%3e%3c/svg%3e"); }
</style>
<!-- The SVG has no viewBox and no fixed size, so it has neither a natural size nor a
     ratio: it fills the box once, as one dashed rounded rectangle 350 by 64. Drawn as
     square tiles side by side, it is wrong. -->
<div id="box"></div>
