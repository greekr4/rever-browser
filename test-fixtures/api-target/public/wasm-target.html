<!doctype html><meta charset="utf-8"><title>WASM target</title>
<pre id="truth"></pre><pre id="out"></pre>
<script type="module">

//   module URL     /sign.wasm
//   export name    checksum
//   wasm_decompile snippet must contain:  (export "checksum"
document.getElementById('truth').textContent =
  'GROUND TRUTH\n  wasm: /sign.wasm\n  export: checksum\n  expect in wasm_decompile: (export "checksum"';
import { loadSigner } from '/wasm-caller.js';   // external bundle -> captured Script (for wasm_xref)

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
