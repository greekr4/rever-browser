<!doctype html>
<meta charset="utf-8">
<title>a checkbox stretched over a custom switch</title>
<style>
  .switch { position: relative; display: inline-flex; width: 40px; height: 24px; margin: 20px; }
  .switch input { position: absolute; inset: 0; z-index: 20; opacity: 0; cursor: pointer;
                  width: 100%; height: 100%; margin: 0; }
  .switch div { position: absolute; inset: 4px; border-radius: 9999px; background: #999;
                pointer-events: none; }
  .switch input:checked + div { background: #63c; }
  input.plain { margin: 20px; }
</style>
<!-- The invisible checkbox must cover the whole switch (40 by 24), so a click anywhere
     on it turns the switch purple. The plain checkbox keeps its default 14 by 14. -->
<label class="switch" id="switch"><input type="checkbox" id="stretched"><div></div></label>
<input type="checkbox" class="plain" id="plain">
<input type="radio" class="plain" id="radio">
