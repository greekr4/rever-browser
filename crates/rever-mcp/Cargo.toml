[package]
name = "rever-mcp"
version = "0.0.0"
edition = "2024"
publish = false
description = "The control server: serves registered tools over a Unix socket and publishes it"

[dependencies]
rever-tools-api = { path = "../rever-tools-api" }
# Validation, paging and the tool profile — the transport-free half.
rever-control = { path = "../rever-control" }
# The scope-off note appended to active-attack tool results.
rever-scope = { path = "../rever-scope" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# The token's random bytes.
getrandom = "0.3"
