[package]
name = "rever-html2md"
version = "0.0.0"
edition = "2024"
publish = false
description = "Read-only DOM to Markdown conversion, vendored from lexmount/moli"

[dependencies]
# The workspace already pins 2.1 (via servo); staying on it adds no crates.
icu_properties = { version = "2.1", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
html5ever = "0.39"
markup5ever_rcdom = "0.39"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1.0.145"
