[package]
name = "rever-ui-markdown"
version = "0.0.0"
edition = "2024"
publish = false
description = "Markdown rendering for chat messages"

[dependencies]
gpui = { workspace = true }
rever-ui-kit = { path = "../rever-ui-kit" }
rever-core = { path = "../rever-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parser only: the html renderer and the CLI are not used.
pulldown-cmark = { version = "0.13", default-features = false }
# Unicode punctuation classes for the autolink rules; already in the workspace.
regex = "1"

[[example]]
name = "preview_markdown"
path = "examples/preview.rs"

[dev-dependencies]
# TestAppContext: the drag selection is tested against a real window tree.
gpui = { workspace = true, features = ["test-support"] }
